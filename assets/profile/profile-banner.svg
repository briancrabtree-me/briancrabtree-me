<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Brian Crabtree  Senior web architect">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#111111"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="#0a0a0a"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#scan)" opacity="0.35"/>
  <!-- frame -->
  <rect x="24" y="24" width="1152" height="272" fill="none" stroke="#282828" stroke-width="2"/>
  <line x1="24" y1="48" x2="1176" y2="48" stroke="#ccff00" stroke-width="2"/>
  <line x1="24" y1="272" x2="1176" y2="272" stroke="#ccff00" stroke-width="2"/>
  <!-- corner marks -->
  <text x="40" y="72" fill="#ccff00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">///</text>
  <text x="1140" y="72" fill="#ccff00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="end">///</text>
  <!-- name -->
  <text x="600" y="148" fill="#ccff00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" letter-spacing="6" text-anchor="middle">BRIAN CRABTREE</text>
  <text x="600" y="188" fill="#bebebe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="8" text-anchor="middle">SENIOR WEB ARCHITECT</text>
  <text x="600" y="228" fill="#888888" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" text-anchor="middle">VANILLA-FIRST REACT · PLAIN CSS · PAGESPEED-MINDED DELIVERY</text>
  <!-- side ticks -->
  <line x1="48" y1="120" x2="48" y2="200" stroke="#282828" stroke-width="2"/>
  <line x1="1152" y1="120" x2="1152" y2="200" stroke="#282828" stroke-width="2"/>
</svg>
